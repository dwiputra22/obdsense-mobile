name: rushsenseai
description: "OBD Scanner Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  intl: ^0.19.0
  hive: ^2.2.3
  geolocator: ^13.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.9.0
  flserial: ^0.7.3
  path_provider: ^2.1.4

  share_plus: ^12.0.0
  cupertino_icons: ^1.0.8
  go_router: 17.5.0
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.4.3
  hive_flutter: ^1.1.0
  dio: ^5.11.1
  flutter_blue_plus: ^2.3.12
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-rushsense.png"
  adaptive_icon_background: "#06142F"
  adaptive_icon_foreground: "assets/icon/icon-rushsense.png"
